<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수주정보 등록</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.formgrid{display:grid;grid-template-columns:repeat(6,72px minmax(96px,1fr));gap:4px 5px;align-items:center;padding:8px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}
.formgrid .label{font-weight:700;text-align:right;padding-right:4px}
.formgrid .field{width:100%}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}
.lk{display:flex;gap:3px;min-width:0}.lk input{flex:1;min-width:0;height:27px;border:1px solid #b5c0c9;padding:0 6px}
.lk button{width:24px;height:27px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}
.att{margin:0 14px;border:1px solid var(--line);flex:1;min-height:0;overflow:auto;background:#fff}
.secthead{padding:6px 14px 2px;font-weight:700;color:#4b5c6a}
.mask{position:fixed;inset:0;background:rgba(40,50,60,.28);display:none;align-items:flex-start;justify-content:center;z-index:50}
.mask.on{display:flex}
.dlg{margin-top:60px;width:min(520px,92vw);background:#f3f6f8;border:1px solid #7d8d99;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.dlghead{display:flex;align-items:center;height:30px;padding:0 6px 0 10px;background:linear-gradient(#eef4f9,#dbe6ef);border-bottom:1px solid #b9c6d0;font-weight:700}
.dlghead button{margin-left:auto;width:26px;height:20px;border:1px solid #b04a4a;background:#c9484a;color:#fff;cursor:pointer;line-height:1}
.dlgbody{padding:8px}
.dlgbody .srch{display:flex;gap:4px;margin-bottom:6px}
.dlgbody .srch input{flex:1;height:26px;border:1px solid #aeb9c3;padding:0 6px}
.dlgwrap{height:300px;overflow:auto;border:1px solid var(--line);background:#fff}
.dlgfoot{display:flex;justify-content:center;gap:10px;padding:8px}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}

/* ── v24 수주등록 입력박스 크기·배치 정리 ─────────────────────────
 * 기존: 라벨 72px + 필드 min 96px 짜리 6쌍 고정 → 화면이 좁으면 오른쪽
 *       3~6번째 쌍의 입력칸이 화면 밖으로 밀려 라벨만 보였다.
 * 변경: 라벨 폭을 넓히고 쌍 수를 화면 폭에 따라 4→3→2→1로 단계 축소. */
.formgrid{grid-template-columns:repeat(4,86px minmax(132px,1fr));gap:5px 6px;padding:9px 14px}
.formgrid>*{min-width:0}
.field{height:27px}
.field.r{text-align:right}
/* v24.1 입력란 크기 통일: span 해제 */
.span3{grid-column:auto}
/* 코드+명칭+돋보기 조합: 코드칸을 고정폭으로, 명칭칸이 남는 폭을 차지 */
.lk{display:grid;grid-template-columns:62px minmax(0,1fr) 26px;gap:3px;align-items:center}
.lk input{width:100%;min-width:0;height:27px;border:1px solid #b5c0c9;padding:0 6px;box-sizing:border-box}
.lk input[readonly]{background:#f4f7f9}
.lk button{width:26px;height:27px}
/* 코드가 2~3자리인 항목은 코드칸을 더 좁게 */
#proc_cnt{max-width:56px}
@media(min-width:1750px){.formgrid{grid-template-columns:repeat(5,86px minmax(132px,1fr))}}
@media(max-width:1400px){.formgrid{grid-template-columns:repeat(3,86px minmax(120px,1fr))}}
@media(max-width:1080px){.formgrid{grid-template-columns:repeat(2,86px minmax(120px,1fr))}}
@media(max-width:760px){.formgrid{grid-template-columns:86px minmax(0,1fr)}}
/* 첨부파일: 비어 있을 때 과도한 여백 축소 */
.filearea .empty,#fileEmpty{height:64px!important}
</style></head><body><div class="screen">
<div class="title"><h1>수주정보 등록</h1><small>1공장</small></div>
<section class="formgrid">
 <div class="label">제 번</div><div class="span3"><input id="job_no" class="field"></div>
 <div class="label">공 장</div><div><select id="plant" class="field"><option>1공장</option><option>2공장</option></select></div>
 <div class="label">수주일</div><div><input id="order_date" type="date" class="field"></div>
 <div class="label">S1 예정일</div><div><input id="s1p" type="date" class="field"></div>

 <div class="label">수주상태</div><div><select id="status" class="field"><option>진행</option><option>보류</option><option>완료</option><option>취소</option></select></div>
 <div class="label">수주유형</div><div><select id="otype" class="field"><option>신작</option><option>개조</option><option>수리</option><option>유상사급</option></select></div>
 <div class="label">견적서번호</div><div><input id="quo" class="field"></div>
 <div class="label">아이템</div><div class="lk"><input id="item_code"><input id="item_name" readonly><button onclick="openLook('item','item_code','item_name')">…</button></div>
 <div class="label">납기예정일</div><div><input id="dlvp" type="date" class="field"></div>
 <div class="label">국내/해외</div><div><select id="dom" class="field"><option>국내</option><option>해외</option></select></div>

 <div class="label">도 번</div><div class="span3"><input id="drawing_no" class="field"></div>
 <div class="label">사업부</div><div class="lk"><input id="biz_code"><input id="biz_name" readonly><button onclick="openLook('biz','biz_code','biz_name')">…</button></div>
 <div class="label">담당자</div><div class="lk"><input id="mgr_code"><input id="mgr_name" readonly><button onclick="openLook('employee','mgr_code','mgr_name')">…</button></div>
 <div class="label">고객사</div><div class="lk"><input id="cust_code"><input id="cust_name" readonly><button onclick="openLook('customer','cust_code','cust_name')">…</button></div>

 <div class="label">금형타입</div><div class="lk"><input id="mold_code"><input id="mold_name" readonly><button onclick="openLook('mold','mold_code','mold_name')">…</button></div>
 <div class="label">개발유형</div><div><select id="devtype" class="field"><option value=""></option><option>사내</option><option>외주</option></select></div>
 <div class="label">양산처</div><div class="lk"><input id="mp_code"><input id="mp_name" readonly><button onclick="openLook('mass_production','mp_code','mp_name')">…</button></div>
 <div class="label">품 명</div><div><input id="product_name" class="field"></div>
 <div class="label">모 델</div><div><input id="model" class="field"></div>
 <div class="label">공정/조수</div><div class="lk"><input id="proc_cnt"><input id="set_qty"></div>

 <div class="label">견적가</div><div><input id="quo_price" class="field num"></div>
 <div class="label">기계사양</div><div class="lk"><input id="ms_code"><input id="ms_name" readonly><button onclick="openLook('mspec','ms_code','ms_name')">…</button></div>
 <div class="label">사용재료</div><div><input id="material_used" class="field"></div>
 <div class="label">S1 완료일</div><div><input id="s1c" type="date" class="field"></div>
 <div class="label">납기완료일</div><div><input id="dlvc" type="date" class="field"></div>
 <div class="label">ECO</div><div><input id="eco" class="field"></div>

 <div class="label">비 고</div><div class="span3"><input id="remark" class="field"></div>
 <div class="label">수주가</div><div><input id="order_price" class="field num"></div>
 <div class="label">판매가</div><div><input id="sales_price" class="field num"></div>
 <div class="label">완료일</div><div><input id="comp_date" type="date" class="field"></div>
</section>
<div class="secthead">첨부파일</div>
<div class="toolbar"><button class="btn" onclick="msg('프로토타입에서는 파일첨부를 지원하지 않습니다.')">파일첨부</button><button class="btn" onclick="msg('다운로드 대상 파일이 없습니다.')">다운로드</button><button class="btn" onclick="msg('미리보기 대상 파일이 없습니다.')">미리보기</button><button class="btn" onclick="msg('삭제할 파일이 없습니다.')">파일삭제</button></div>
<div class="att"><table style="min-width:900px"><thead><tr><th style="width:34px"></th><th>파일명</th><th style="width:150px">Version</th><th style="width:280px">파일내용</th><th style="width:90px">크기</th><th style="width:90px">확장자</th></tr></thead><tbody id="attBody"><tr><td colspan="6" class="c" style="height:64px;color:#8a97a2">첨부파일이 없습니다.</td></tr></tbody></table></div>
<div class="mask" id="xlMask"><div class="dlg" style="width:min(1100px,96vw);margin-top:30px"><div class="dlghead">엑셀 수주 일괄등록 <span id="xlInfo" style="font-weight:400;color:#6b7a86;margin-left:8px"></span><button onclick="xlClose()">✕</button></div><div class="dlgbody"><div style="display:flex;gap:12px;align-items:center;margin-bottom:6px"><label><input type="checkbox" id="xlOver" onchange="xlRender()"> 이미 있는 제번은 덮어쓰기</label><span style="color:#8a97a2">오류가 있는 줄은 저장하지 않습니다. 고쳐서 다시 올리세요.</span></div><div class="dlgwrap" style="height:min(420px,60vh)"><table style="min-width:900px"><thead><tr><th style="width:44px">행</th><th style="width:120px">제번</th><th style="width:60px">공장</th><th style="width:90px">수주일</th><th style="width:60px">유형</th><th style="width:120px">고객사</th><th style="width:140px">품명</th><th style="width:110px">모델</th><th>상태</th></tr></thead><tbody id="xlBody"></tbody></table></div></div><div class="dlgfoot"><button class="btn" id="xlGo" onclick="xlSave()" style="font-weight:700">▤ 저장</button><button class="btn" onclick="xlClose()">닫기</button></div></div></div>
<footer class="foot"><button class="btn" onclick="save()">▤ 저장</button><button class="btn" onclick="clearForm()">✕ 신규</button><button class="btn" onclick="xlTemplate()" title="수주 일괄등록용 엑셀 양식을 내려받습니다 (* 표시 = 필수)">▦ 엑셀양식</button><button class="btn" onclick="xlFile.click()" title="엑셀 양식에 적은 수주를 한 번에 등록합니다 — 미리보기에서 확인 후 저장">⇪ 엑셀등록</button><input type="file" id="xlFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="xlLoad(this.files[0]);this.value=''"><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">제번 등 필수항목을 입력하고 저장하세요.</span></footer>
</div>


<script src="mes_lookup.js?v=43"></script>

<script>
/* 마스터 조회는 mes_lookup.js(MESLOOK) 사용 - DB 직결 */
const seed={"row_no": 1, "job_no": "J26137", "plant_name": "1공장", "order_status": "진행", "order_type": "신작", "quotation_no": null, "drawing_no": "hfghfgh", "business_division_code": "BN001", "business_division_name": "금형", "item_code": "J", "item_name": "키친", "order_date": "2026-08-22", "s1_planned_date": "2026-08-26", "delivery_planned_date": "2026-08-31", "mold_type_code": null, "mold_type_name": null, "development_type": "사내", "mass_production_vendor_code": "V028", "mass_production_vendor_name": "서한산업", "manager_code": "user01", "manager_name": "권태윤", "domestic_overseas": "국내", "customer_code": "V022", "customer_name": "바림정밀", "quotation_price": null, "machine_spec_code": null, "machine_spec_name": null, "product_name": "vdfs", "model": "asf", "process_set_qty": null, "remark": null, "order_price": null, "sales_price": null, "material_used": null, "s1_completed_date": null, "delivery_completed_date": null, "eco": null, "completion_date": null, "attachments": []};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg=t=>message.textContent=t;
function openLook(key,codeId,nameId){
 const kind={'employee':'employee','vendor':'vendor','customer':'customer',
  'mass_production':'mass_production','item':'item','biz':'biz','mold':'mold','mspec':'mspec'}[key]||key;
 MESLOOK.bindPair(kind,codeId,nameId);
}
const MAP={job_no:'job_no',plant:'plant_name',order_date:'order_date',s1p:'s1_planned_date',
 status:'order_status',otype:'order_type',quo:'quotation_no',item_code:'item_code',item_name:'item_name',
 dlvp:'delivery_planned_date',dom:'domestic_overseas',drawing_no:'drawing_no',
 biz_code:'business_division_code',biz_name:'business_division_name',
 mgr_code:'manager_code',mgr_name:'manager_name',cust_code:'customer_code',cust_name:'customer_name',
 mold_code:'mold_type_code',mold_name:'mold_type_name',devtype:'development_type',
 mp_code:'mass_production_vendor_code',mp_name:'mass_production_vendor_name',
 product_name:'product_name',model:'model',set_qty:'process_set_qty',quo_price:'quotation_price',
 ms_code:'machine_spec_code',ms_name:'machine_spec_name',material_used:'material_used',
 s1c:'s1_completed_date',dlvc:'delivery_completed_date',eco:'eco',remark:'remark',
 order_price:'order_price',sales_price:'sales_price',comp_date:'completion_date'};
function load(o){for(const[el,k]of Object.entries(MAP)){const n=document.getElementById(el);if(n)n.value=o[k]??''}}
function clearForm(){for(const el of Object.keys(MAP)){const n=document.getElementById(el);if(n)n.value=''}plant.value='1공장';document.getElementById('status').value='진행';otype.value='신작';dom.value='국내';msg('신규 입력 상태입니다.')}
const NUMF=['quotation_price','order_price','sales_price','process_set_qty'];
const DATEF=['order_date','s1_planned_date','delivery_planned_date','s1_completed_date','delivery_completed_date','completion_date'];
let BULK=false;   /* 엑셀 일괄등록 중에는 확인창을 띄우지 않는다 */
async function save(){
 if(!job_no.value.trim()){msg('제번은 필수입니다.');return false}
 const o={};for(const[el,k]of Object.entries(MAP)){const n=document.getElementById(el);if(n)o[k]=n.value||null}
 for(const k of NUMF){const v=Number(o[k]);o[k]=(o[k]===null||o[k]===''||Number.isNaN(v))?null:v}
 for(const k of DATEF)if(o[k]==='')o[k]=null;
 if(!window.MESDB||!MESDB.online){msg(`${o.job_no} 저장했습니다. (DB 미연결 - 로컬)`);return false}
 /* v28: 수주취소 시 하위 진행분 경고 (취소 파급이 없어 발주가 고아로 남던 문제) */
 if(o.order_status==='취소'){
  try{
   const [sl,ol]=await Promise.all([
    MESDB.table('set_order_lines').select(`select=line_id,status&job_no=eq.${encodeURIComponent(o.job_no)}`),
    MESDB.table('order_lines').select(`select=line_id,status&job_no=eq.${encodeURIComponent(o.job_no)}`)]);
   const done=[...(sl||[]),...(ol||[])].filter(r=>r.status!=='발주').length;
   const open=[...(sl||[]),...(ol||[])].filter(r=>r.status==='발주').length;
   if(open+done>0){
    if(done>0){msg(`${o.job_no} 은(는) 이미 입고·확정된 건이 ${done}건 있어 취소할 수 없습니다. 입고취소 후 진행하세요.`);return false}
    if(BULK){msg(`${o.job_no} 미입고 발주 ${open}건이 있어 엑셀로는 취소할 수 없습니다. 화면에서 처리하세요.`);return false}
    if(!confirm(`${o.job_no}\n미입고 발주 ${open}건이 남아 있습니다.\n수주를 취소하면 해당 발주는 SET발주등록 / 입고등록 화면에서 직접 취소해야 합니다.\n계속하시겠습니까?`))return false;
   }
  }catch(e){}
 }
 try{
  /* FK 순서: jobs(부모) → sale_orders → 수주현황 */
  await MESDB.table('jobs').upsert({job_no:o.job_no,item_name:o.item_name,customer_name:o.customer_name,
    order_status:o.order_status,order_date:o.order_date,source_count:1},'job_no');
  await MESDB.table('sale_orders').upsert(o,'job_no');
  /* 같은 제번을 다시 저장해도 현황에 중복행이 생기지 않도록 기존 row_no 재사용 */
  let rowNo=null;
  try{
   const ex=await MESDB.table('sale_order_status_rows')
     .select(`select=row_no&job_no=eq.${encodeURIComponent(o.job_no)}&limit=1`);
   if(ex&&ex[0])rowNo=ex[0].row_no;
  }catch(e){rowNo=null}
  /* v39: 신규는 row_no 를 보내지 않고 DB identity 에 맡긴다 (수동 max+1 은 동시 저장 시 충돌) */
  const _sr={job_no:o.job_no,model:o.model,
    drawing_no:o.drawing_no,item_name:o.item_name,eco:o.eco,customer_name:o.customer_name,set_qty:o.process_set_qty,
    development_type:o.development_type,order_type:o.order_type,mold_type_name:o.mold_type_name,
    machine_spec_name:o.machine_spec_name,order_date:o.order_date,s1_planned_date:o.s1_planned_date,
    completion_date:o.completion_date,mass_production_vendor_name:o.mass_production_vendor_name,
    order_status:o.order_status,plant_name:o.plant_name};
  if(rowNo!=null)await MESDB.table('sale_order_status_rows').upsert({row_no:Number(rowNo),..._sr},'row_no');
  else{const r=await MESDB.table('sale_order_status_rows').insertOne(_sr);rowNo=r&&r.row_no}
  msg(`${o.job_no} 수주를 저장했습니다. (제번·수주·수주현황 반영 / 현황 No.${rowNo??'-'})`);
 }catch(e){msg('DB 저장 실패: '+e.message.slice(0,140));return false}
 return true;
}
window.MES={save,clearForm,setMessage:msg};
load(seed);
</script>
<script>
/* ── 엑셀 양식으로 수주 일괄등록 ─────────────────────────────────────────
 *  [▦ 엑셀양식] 양식 내려받기 (* = 필수) → 작성 → [⇪ 엑셀등록] → 미리보기에서 확인 → 저장
 *  한 줄 = 제번 1건. 저장은 화면 [▤ 저장]과 같은 경로(제번·수주·수주현황)를 탄다.
 *  고객사·사업부·아이템·금형타입·기계사양·양산처·담당자는 기준정보의 코드 또는 이름으로 적는다. */
const XL_COLS=[   /* [머리글, 입력칸 id, 필수, 설명] */
 ['제번','job_no',1,'예) J26137'],
 ['공장','plant',0,'1공장 / 2공장 (비우면 1공장)'],
 ['수주일','order_date',1,'2026-10-13 형식 또는 엑셀 날짜'],
 ['수주유형','otype',1,'신작 / 개조 / 수리 / 유상사급 중 하나'],
 ['고객사','cust',1,'기준정보 업체(고객사)의 코드 또는 이름'],
 ['품명','product_name',1,''],
 ['모델','model',1,''],
 ['수주상태','status',0,'진행 / 보류 / 완료 / 취소 (비우면 진행)'],
 ['사업부','biz',0,'기준정보 사업부 코드 또는 이름'],
 ['아이템','item',0,'기준정보 아이템 코드 또는 이름'],
 ['금형타입','mold',0,'기준정보 금형타입 코드 또는 이름'],
 ['기계사양','ms',0,'기준정보 기계사양 코드 또는 이름'],
 ['양산처','mp',0,'기준정보 업체(양산처) 코드 또는 이름'],
 ['담당자','mgr',0,'사원코드 또는 사원명'],
 ['개발유형','devtype',0,'사내 / 외주'],
 ['도번','drawing_no',0,''],
 ['견적서번호','quo',0,''],
 ['견적가','quo_price',0,'숫자'],
 ['수주가','order_price',0,'숫자'],
 ['판매가','sales_price',0,'숫자'],
 ['조수','set_qty',0,'숫자'],
 ['사용재료','material_used',0,''],
 ['ECO','eco',0,''],
 ['S1 예정일','s1p',0,'날짜'],
 ['납기예정일','dlvp',0,'날짜'],
 ['국내/해외','dom',0,'국내 / 해외 (비우면 국내)'],
 ['비고','remark',0,'']];
const XL_LOOK={cust:['customer','cust_code','cust_name'],biz:['biz','biz_code','biz_name'],item:['item','item_code','item_name'],mold:['mold','mold_code','mold_name'],
 ms:['mspec','ms_code','ms_name'],mp:['mass_production','mp_code','mp_name'],mgr:['employee','mgr_code','mgr_name']};
const XL_DATE=new Set(['order_date','s1p','dlvp']),XL_NUM=new Set(['quo_price','order_price','sales_price','set_qty']);
const XL_SEL={plant:['1공장','2공장'],otype:['신작','개조','수리','유상사급'],status:['진행','보류','완료','취소'],devtype:['사내','외주'],dom:['국내','해외']};
let XL=[];
function xlLib(){if(window.XLSX)return Promise.resolve();return new Promise((ok,no)=>{const s=document.createElement('script');
 s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>ok();s.onerror=()=>no(new Error('엑셀 모듈을 불러오지 못했습니다 (인터넷 연결 확인)'));document.head.appendChild(s)})}
async function xlTemplate(){
 try{await xlLib()}catch(e){return msg(e.message)}
 const head=XL_COLS.map(c=>c[0]+(c[2]?'*':''));
 const ex={제번:'J26001',공장:'1공장',수주일:new Date().toISOString().slice(0,10),수주유형:'신작',고객사:'(고객사 이름)',품명:'(품명)',모델:'(모델)',수주상태:'진행',개발유형:'사내','국내/해외':'국내'};
 const ws=XLSX.utils.aoa_to_sheet([head,XL_COLS.map(c=>ex[c[0]]??'')]);ws['!cols']=XL_COLS.map(c=>({wch:Math.max(10,c[0].length*2+4)}));
 const guide=XLSX.utils.aoa_to_sheet([['항목','필수','작성 방법'],...XL_COLS.map(c=>[c[0],c[2]?'필수':'',c[3]]),[],
  ['※ 첫 줄(머리글)은 지우거나 바꾸지 마세요. 2번째 줄의 예시는 지우고 작성하세요.'],['※ 한 줄 = 제번 1건. 같은 제번을 두 줄에 쓰면 오류입니다.'],['※ 이미 등록된 제번은 미리보기에서 「덮어쓰기」를 체크해야 저장됩니다.']]);
 guide['!cols']=[{wch:14},{wch:6},{wch:60}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'수주등록');XLSX.utils.book_append_sheet(wb,guide,'작성안내');
 XLSX.writeFile(wb,'수주등록_양식.xlsx');msg('수주등록 엑셀 양식을 내려받았습니다. * 표시 항목은 반드시 입력하세요.');
}
function xlDate(v){
 if(v==null||v==='')return '';
 if(typeof v==='number'&&v>20000&&v<80000)return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10);
 const t=String(v).trim(),m=/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(t)||/^(\d{4})(\d{2})(\d{2})$/.exec(t);
 return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:null}
const xlKey=h=>String(h||'').replace(/[*\s]/g,'').replace(/\(.*\)$/,'');
const xlName=id=>XL_COLS.find(c=>c[1]===id)[0];
async function xlLoad(file){
 if(!file)return;
 try{await xlLib()}catch(e){return msg(e.message)}
 if(!window.MESDB||!MESDB.online)return msg('DB 미연결 — 엑셀 등록을 할 수 없습니다.');
 msg(file.name+' 읽는 중…');
 let grid;
 try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets['수주등록']||wb.Sheets[wb.SheetNames[0]];
  grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:'',blankrows:false})}catch(e){return msg('엑셀을 읽지 못했습니다: '+String(e.message||e).slice(0,100))}
 const hi=grid.findIndex(r=>r.some(c=>xlKey(c)==='제번'));
 if(hi<0)return msg('「제번」 머리글을 찾지 못했습니다. [▦ 엑셀양식]으로 받은 양식을 쓰세요.');
 const col={};grid[hi].forEach((h,i)=>{const k=xlKey(h);const c=XL_COLS.find(x=>xlKey(x[0])===k);if(c&&col[c[1]]==null)col[c[1]]=i});
 const miss=XL_COLS.filter(c=>c[2]&&col[c[1]]==null).map(c=>c[0]);
 if(miss.length)return msg('엑셀에 필수 열이 없습니다: '+miss.join(', '));
 /* 기준정보 (코드·이름 둘 다로 찾기) */
 const ref={};
 for(const[k,[kind]]of Object.entries(XL_LOOK)){if(col[k]==null)continue;
  try{const K=MESLOOK.KINDS[kind],rs=await MESLOOK.rows(kind);ref[k]=rs.map(r=>{const m=K.map(r);return {code:String((K.code?K.code(r):m[0])??''),name:String((K.name?K.name(r):m[1])??'')}})}catch(e){ref[k]=null}}
 let exist=new Set();
 try{const rs=await MESDB.table('sale_orders').select('select=job_no',{fresh:true});exist=new Set((rs||[]).map(r=>String(r.job_no)))}catch(e){}
 XL=[];const seen=new Map();
 grid.slice(hi+1).forEach((r,i)=>{
  const get=id=>col[id]==null?'':r[col[id]];
  if(XL_COLS.every(c=>String(get(c[1])??'').trim()===''))return;   /* 빈 줄 */
  const v={},err=[];
  for(const[h,id,req]of XL_COLS){let x=get(id);
   if(XL_DATE.has(id)){const d=xlDate(x);if(d===null){err.push(`${h} 날짜 형식 오류(${x})`);x=''}else x=d}
   else if(XL_NUM.has(id)){const t=String(x??'').replace(/[,\s원]/g,'');if(t!==''&&Number.isNaN(Number(t))){err.push(`${h} 숫자 아님(${x})`);x=''}else x=t}
   else x=String(x??'').trim();
   if(req&&x==='')err.push(h+' 비어 있음');
   v[id]=x}
  v.job_no=v.job_no.toUpperCase();
  for(const[id,ok]of Object.entries(XL_SEL))if(v[id]&&!ok.includes(v[id]))err.push(`${xlName(id)} 「${v[id]}」 (${ok.join('/')} 중 하나)`);
  for(const k of Object.keys(XL_LOOK)){if(!v[k])continue;const L=ref[k];
   if(!L){err.push(xlName(k)+' 기준정보를 읽지 못함');continue}
   const q=v[k].toLowerCase(),hit=L.find(x=>x.code.toLowerCase()===q)||L.find(x=>x.name.toLowerCase()===q);
   if(!hit)err.push(`${xlName(k)} 「${v[k]}」 기준정보에 없음`);else v[k]=hit}
  if(v.job_no){if(seen.has(v.job_no))err.push(`제번 중복 (${seen.get(v.job_no)}행과 같음)`);else seen.set(v.job_no,hi+i+2)}
  XL.push({row:hi+i+2,v,err,exist:exist.has(v.job_no)})});
 if(!XL.length)return msg('엑셀에 등록할 줄이 없습니다.');
 xlOver.checked=false;xlRender();xlMask.classList.add('on');
 msg(`${file.name} — ${XL.length}줄을 읽었습니다. 미리보기에서 확인 후 [▤ 저장]을 누르세요.`);
}
const xlOk=x=>!x.err.length&&(!x.exist||xlOver.checked)&&!x.done;
function xlRender(){
 const nm=v=>v&&typeof v==='object'?v.name:(v||'');
 xlBody.innerHTML=XL.map(x=>{const v=x.v;
  const st=x.done?`<span style="color:#1d6b3a">✔ ${esc(x.done)}</span>`:x.fail?`<span style="color:#b02a37">저장 실패 — ${esc(x.fail)}</span>`
   :x.err.length?`<span style="color:#b02a37">✖ ${esc(x.err.join(' · '))}</span>`
   :x.exist?(xlOver.checked?'<span style="color:#8a4f08">기존 수주 덮어쓰기</span>':'<span style="color:#8a97a2">이미 있음 — 건너뜀</span>'):'<span style="color:#1d5da3">신규 등록</span>';
  return `<tr><td style="text-align:center">${x.row}</td><td>${esc(v.job_no)}</td><td style="text-align:center">${esc(v.plant||'1공장')}</td><td style="text-align:center">${esc(v.order_date)}</td><td style="text-align:center">${esc(v.otype||'-')}</td><td>${esc(nm(v.cust))}</td><td>${esc(v.product_name)}</td><td>${esc(v.model)}</td><td title="${esc(x.err.join('\n'))}">${st}</td></tr>`}).join('');
 const ok=XL.filter(xlOk).length,bad=XL.filter(x=>x.err.length).length;
 xlInfo.textContent=`전체 ${XL.length}줄 · 저장 대상 ${ok}건${bad?` · 오류 ${bad}건`:''}`;
 xlGo.disabled=!ok;
}
function xlClose(){xlMask.classList.remove('on')}
async function xlSave(){
 const todo=XL.filter(xlOk);if(!todo.length)return;
 if(!confirm(`수주 ${todo.length}건을 저장합니다.${todo.some(x=>x.exist)?'\n(이미 있는 제번은 엑셀 내용으로 덮어씁니다)':''}\n계속할까요?`))return;
 xlGo.disabled=true;let ok=0,ng=0;
 BULK=true;
 try{for(const x of todo){const v=x.v;
  clearForm();
  for(const[,id]of XL_COLS){if(XL_LOOK[id]){const[,c,n]=XL_LOOK[id];if(v[id]){document.getElementById(c).value=v[id].code;document.getElementById(n).value=v[id].name}continue}
   const el=document.getElementById(id);if(el&&v[id]!=='')el.value=v[id]}
  msg(`엑셀 등록 중… ${ok+ng+1}/${todo.length} — ${v.job_no}`);
  let r=false;try{r=await save()}catch(e){x.fail=String(e.message||e).slice(0,80)}
  if(r===true){ok++;x.done=x.exist?'덮어씀':'등록됨'}else{ng++;x.fail=x.fail||message.textContent.slice(0,100)}
  xlRender()}}
 finally{BULK=false}
 clearForm();xlRender();
 try{MESDB.notify&&MESDB.notify(['sale_orders','sale_order_status_rows','jobs'])}catch(e){}
 msg(`엑셀 등록 완료 — 저장 ${ok}건${ng?` · 실패 ${ng}건 (미리보기 상태 칸 확인)`:''}`);
}
</script>
